<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Interface - Speech Transcription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-user-graduate"></i> Student Interface</h1>
            <a href="/" class="btn btn-outline">← Back to Home</a>
        </header>

        <div class="controls">
            <div class="control-group">
                <button id="startBtn" class="btn btn-success">
                    <i class="fas fa-microphone"></i> Speak to Respond
                </button>
                <button id="stopBtn" class="btn btn-danger" disabled>
                    <i class="fas fa-stop"></i> Stop Speaking
                </button>
                <button id="clearBtn" class="btn btn-warning">
                    <i class="fas fa-trash"></i> Clear Conversation
                </button>
            </div>
            
            <div class="status-indicator">
                <div id="micStatus" class="status-item">
                    <i class="fas fa-microphone-slash"></i>
                    <span>Microphone Off</span>
                </div>
                <div id="connectionStatus" class="status-item">
                    <i class="fas fa-wifi"></i>
                    <span>Connecting...</span>
                </div>
                <div id="newMessageAlert" class="status-item alert-item" style="display: none;">
                    <i class="fas fa-bell"></i>
                    <span>New Message!</span>
                </div>
            </div>
        </div>

        <div class="live-transcription">
            <h3>Live Teacher Speech:</h3>
            <div id="liveText" class="live-text">Waiting for teacher to speak...</div>
        </div>

        <div class="transcription-area">
            <div class="current-transcription">
                <h3>Your Speech:</h3>
                <div id="currentText" class="current-text">Start speaking to see your transcription here...</div>
                <div id="confidenceLevel" class="confidence-level"></div>
            </div>
        </div>

        <div class="conversation-container">
            <h3>Conversation History:</h3>
            <div id="conversationHistory" class="conversation-history"></div>
        </div>

        <div class="text-input-area">
            <div class="input-group">
                <input type="text" id="textInput" placeholder="Type your message..." class="text-input">
                <button id="sendTextBtn" class="btn btn-primary">
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </div>

        <div class="settings-panel">
            <h4>Accessibility Settings:</h4>
            <div class="setting-item">
                <label for="fontSizeSlider">Text Size:</label>
                <input type="range" id="fontSizeSlider" min="14" max="28" value="16" class="slider">
                <span id="fontSizeValue">16px</span>
            </div>
            <div class="setting-item">
                <label for="flashOnNewMessage">Flash on new message:</label>
                <input type="checkbox" id="flashOnNewMessage" checked>
            </div>
            <div class="setting-item">
                <label for="autoScroll">Auto-scroll to new messages:</label>
                <input type="checkbox" id="autoScroll" checked>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/student.js') }}"></script>
</body>
</html>
